# Despliegue en Render (https://render.com): New > Blueprint, elige este repositorio.
services:
  - type: web
    name: analitica-tienda
    runtime: docker
    plan: standard          # 2 GB de RAM: YOLO y la re-identificación no caben en menos
    healthCheckPath: /_stcore/health
    envVars:
      - key: DATOS_APP
        value: /datos
    disk:
      name: datos
      mountPath: /datos
      sizeGB: 5
